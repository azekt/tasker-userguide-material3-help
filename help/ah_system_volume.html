<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>System Volume</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>System Volume</h1>
                <p class="description">Volume level of system sounds.</p>
            </header>

            <p>Setting to <var>0</var> will mute system sounds.</p>
            <p>When <span class="param icon icon-boolean">Display</span> is enabled, a popup will show the new level.</p>
            <p>When <span class="param icon icon-boolean">Sound</span> is enabled, a tone will sound at the new volume level.</p>
            <p><b>Note:</b> System Sounds must also be enabled if required.</p>
        </main>
    </body>
</html>
