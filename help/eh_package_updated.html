<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Package Updated</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Package Updated</h1>
                <p class="description">An existing package has just been updated.</p>
            </header>

            <p><span class="param icon icon-text">Name</span> is the name of the updated package e.g. <var>Analog Compass</var>.</p>
            <p><span class="param icon icon-text">Package</span> is the package name e.g. <var>com.example.packagename</var>.</p>
        </main>
    </body>
</html>
