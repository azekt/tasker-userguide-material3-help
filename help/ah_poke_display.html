<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Turn On</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Turn On</h1>
                <p class="description">If the display is off, it will be turned on.</p>
            </header>

            <section>
                <h2>Action Inputs</h2>
                <h3 class="param icon icon-number">Block Time</h3>
                <p>When the screen is turned on, screen will be blocked for this many milliseconds. In most cases the default value should work, but if it doesn't work on your device, try using a higher value.</p>
            </section>
        </main>
    </body>
</html>
