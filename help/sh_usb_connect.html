<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>USB Connected</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>USB Connected</h1>
                <p class="description">Whether a device of the specified class is currently connected.</p>
            </header>

            <p>Due to limitations of the Android USB interface, successful detection of USB connections is extremely dependent on the hardware of both the host and USB device.</p>
            <p><b>Note:</b> The <span class="param icon icon-list">Class</span> <var>Any</var> does <b>not</b> include USB Hubs.</p>
        </main>
    </body>
</html>
