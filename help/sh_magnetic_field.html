            <header>
                <h1>Magnetic Field</h1>
                <p class="description">The absolute magnetic field strength at the current location in <abbr title="microtesla">μT</abbr>.</p>
            </header>

            <p>Magnetic fields will be detected better on some axis than on others e.g. the base of the device may be more sensitive than the edge.</p>

            <footer>
                <h2>See also:</h2>
