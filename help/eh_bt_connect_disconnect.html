<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>BT Connection</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>BT Connection</h1>
                <p class="description">Will trigger every time a bluetooth device connects <strong>or</strong> disconnects from your Android device.</p>
            </header>

            <h2>Related video</h2>
            <ul>
                <li><a href="https://youtu.be/HmcNmtJvSvw">Tasker - BT Connect Event</a></li>
            </ul>
            <hr />

            <p>You can check which of the events happened (connection/disconnection) by checking the <var>%bt_connected</var> variable in the profile's task.</p>
        </main>
    </body>
</html>
