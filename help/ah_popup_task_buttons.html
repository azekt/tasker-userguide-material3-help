<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Popup Task Buttons</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Popup Task Buttons</h1>
                <p class="description">Show a popup box with a message and 1-3 buttons with Task names, icons or both.</p>
            </header>

            <p>If one of the buttons is clicked, the popup exits and the relevant task is performed.</p>
        </main>
    </body>
</html>
