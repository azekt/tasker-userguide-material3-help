<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Music Stop</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Music Stop</h1>
                <p class="description">Stop playback of a sound file or directory which was previously started with <a href="ah_music_play.html">Music Play</a>.</p>
            </header>

            <p>If <span class="param icon icon-boolean">Clear Dir</span> is specified and a directory was being played, next time <a href="ah_music_play.html">Music Play</a> is used the playback will start from the first file.</p>
        </main>
    </body>
</html>
