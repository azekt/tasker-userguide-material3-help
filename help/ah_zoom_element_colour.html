<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Zoom Colour</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Zoom Colour</h1>
                <p class="description">Set the <span class="param icon icon-text">Colour</span> and <span class="param icon icon-text">End Colour</span> of the specified Zoom oval or rectangle element.</p>
            </header>

            <p><span class="param icon icon-text">End Colour</span> is only used if a shading has been specified for the element in Zoom.</p>
        </main>
    </body>
</html>
