<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ping</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Ping</h1>
                <p class="description">Tests the connection and latency between you and the specified host.</p>
            </header>

            <p><span class="param icon icon-number">Number</span> is the number of times it'll ping the host</p>
            <p>If <span class="param icon icon-text">Number</span> is set to <var>1</var> the 3 result variables will have the same value.</p>
            <p>If there is no internet connection or the host can't be reached the action will end in an error.</p>
        </main>
    </body>
</html>
