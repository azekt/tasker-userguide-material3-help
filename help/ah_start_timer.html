<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Start System Timer</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Start System Timer</h1>
                <p class="description">Start a system or 3rd party countdown timer.</p>
            </header>

            <p>When <span class="param icon icon-boolean">Show UI</span> is selected the UI of the timer app will be displayed, otherwise probably only a notification will be shown.</p>
            <p>This action has no relation to Tasker's countdown timer widgets.</p>
        </main>
    </body>
</html>
