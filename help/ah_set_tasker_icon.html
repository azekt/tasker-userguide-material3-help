<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Set Tasker Icon</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Set Tasker Icon</h1>
                <p class="description">Set the icon for Tasker's permanent notification in the status bar.</p>
            </header>

            <p>Lasts until the monitor service is stopped e.g. due to disabling Tasker.</p>
            <p>To permanently change the icon, see <i>Menu / Preferences / Monitor / Notification Icon</i></p>
        </main>
    </body>
</html>
