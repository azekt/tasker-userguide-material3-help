<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Missed Call</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Missed Call</h1>
                <p class="description">The Android call log has one or missed calls.</p>
            </header>

            <p>If a <span class="param icon icon-text">Caller</span> is specified, only missed calls from that number are relevant (see <a href="../matching.html">Pattern Matching</a> in the Userguide).</p>
            <p>If you want something to happen every time there is a <i>new</i> missed call, use the <a href="eh_missed_call.html">Missed Call</a> event instead.</p>
        </main>
    </body>
</html>
