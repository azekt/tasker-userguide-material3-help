<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>GZip</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>GZip</h1>
                <p class="description">Compress the specified file on the SD card to a gzip archive of the same name with a <code>.gz</code> extension.</p>
            </header>

            <p>Specify <span class="param icon icon-boolean">Delete Orig</span> to delete the original file if the compression succeeds.</p>
        </main>
    </body>
</html>
