<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Element Map Control</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Element Map Control</h1>
                <p class="description">Manipulate a Map scene element e.g. to zoom in or out</p>

            <p><b>Note:</b> <var>Enable Compass</var>: the compass is only shown when the map is tilted or rotated.</p>
        </main>
