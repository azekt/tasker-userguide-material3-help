<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>UnZip</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>UnZip</h1>
                <p class="description">Decompress the specified zip archive file on the SD card.</p>
            </header>

            <p>You do not need to add <code>.zip</code> on the end of the filename.</p>
            <p>Specify <span class="param icon icon-boolean">Delete Zip</span> to delete the zip file if the compression succeeds.</p>
        </main>
    </body>
</html>
