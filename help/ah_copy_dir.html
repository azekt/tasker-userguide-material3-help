<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Copy Dir</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Copy Dir</h1>
                <p class="description">Recursively copy a directory to a new one.</p>
            </header>

            <p>If <span class="param icon icon-text">To</span> specifies an existing directory, the copy will be placed <strong>inside</strong> it, otherwise the copy will have that name.</p>
        </main>
