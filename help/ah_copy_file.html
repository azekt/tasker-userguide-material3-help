<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Copy File</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Copy File</h1>
                <p class="description">Copy an SD card file to a new directory.</p>
            </header>

            <p>If <span class="param icon icon-text">To</span> specifies an existing file, it will be overwritten.</p>
            <p>The paths start in the root directory of the SD card.</p>
            <p>Root users: note that the <i>"Mount namespace separation"</i> option of SuperSu can cause problems.</p>
        </main>
    </body>
</html>
