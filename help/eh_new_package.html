<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>New Package</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>New Package</h1>
                <p class="description">A new package has just been added to the system.</p>
            </header>

            <p><span class="param icon icon-text">Name</span> is the name of the new package e.g. <var>Analog Compass</var></p>
            <p><span class="param icon icon-text">Package</span> is the package name e.g. <var>com.example.packagename</var>.</p>
            <p>This event does not occur when a new version of a package is replacing an older one.</p>
        </main>
    </body>
</html>
