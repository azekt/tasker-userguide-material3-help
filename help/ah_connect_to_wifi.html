<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Connect To Wifi</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Connect To Wifi</h1>
                <p class="description">Force a connection to a certain Wifi network.</p>
            </header>

            <p>The selected network has to already have been connected to before and currently be configured on your device as connectable, ie, if you "forget" a network, this action won't work with it anymore.</p>
        </main>
    </body>
