<html lang="en">

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Variable Query</title>
        <link rel="stylesheet" href="../css/style.css" />

    <body>
        <main>
            <header>
                <h1>Variable Query</h1>
