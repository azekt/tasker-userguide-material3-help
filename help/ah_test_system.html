<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Test System</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Test System</h1>
                <p class="description">Test an attribute of the operating system.</p>
            </header>

            <section>
                <h2>Action Inputs</h2>
                <h3 class="param icon icon-list">Type</h3>
                <ul>
                    <li><var>Android ID</var>: 64 bit hex value which should be constant for the life of the device.</li>
                    <li><var>UserID</var>: the user ID of the current active (foreground) user.</li>
                </ul>
            </section>
        </main>
    </body>
</html>
