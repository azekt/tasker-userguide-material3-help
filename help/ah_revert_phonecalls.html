<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Call Revert</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Call Revert</h1>
                <p class="description">Stop blocking or diverting calls to the specified number.</p>
            </header>

            <p>If no <span class="param icon icon-text">Number</span> is specified, all blocks and diversions will be cancelled.</p>
            <p>If <span class="param icon icon-boolean">Info</span> is checked, all diversions and blocks will be displayed after the action.</p>

            <footer>
                <h2>See also:</h2>
                <ul>
                    <li>
                        <a href="ah_block_phonecalls.html">Call Block</a> action
                    </li>
                    <li>
                        <a href="ah_divert_phonecalls.html">Call Divert</a> action
                    </li>
                </ul>
            </footer>
        </main>
    </body>
</html>
