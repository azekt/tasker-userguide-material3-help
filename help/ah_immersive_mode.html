<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Immersive Mode</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Immersive Mode</h1>
            </header>

            <p>Can hide:</p>
            <ul>
                <li><b>Status Bar</b>: the bar above the Android UI, where the notification icons reside</li>
                <li><b>Navigation Bar</b>: the bar below the Android UI, where the home, back and recent apps buttons reside</li>
            </ul>
        </main>
    </body>
</html>
