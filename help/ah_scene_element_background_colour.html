<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Element Back Colour</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Element Back Colour</h1>
                <p class="description">Set the background colour(s) of a scene element.</p>
            </header>

            <p>Applies to <i>Text</i>, <i>TextEdit</i>, <i>Image</i>, <i>Menu</i>, <i>Oval</i> and <i>Rectangle</i> elements.</p>
            <p><span class="param icon icon-text">End Colour</span> is only relevant if the element's background has a <i>Shader</i> specified.</p>
            <p>The scene must have been created first.</p>
        </main>
    </body>
</html>
