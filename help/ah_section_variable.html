<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Variable Section</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Variable Section</h1>
                <p class="description">Select a particular section of a variable and throw away the rest.</p>
            </header>

            <p>If <span class="param icon icon-boolean">Adapt To Fit</span> is checked, the specified <span class="param icon icon-number">Length</span> is changed, if it is too long, so that the selected section ends at the end of the original variable contents.</p>
        </main>
    </body>
</html>
