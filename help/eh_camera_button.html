<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Button: Camera</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Button: Camera</h1>
                <p class="description">The camera hardware button has been pressed and held.</p>
            </header>

            <p>Often, if you respond to this event, you will want to set the <span class="param icon icon-list">Priority</span> <var>high</var> and also set the <span class="param icon icon-boolean">Stop Event</span> so that the camera application is not launched.</p>
        </main>
    </body>
</html>
