<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Phone Ringing</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Phone Ringing</h1>
                <p class="description">There is an incoming phone call.</p>
            </header>

            <p>If specified, <span class="param icon icon-text">Caller</span> must match the incoming call (see <a href="../matching.html">Pattern Matching</a> in the Userguide).</p>
            <p>The caller number will be <code>0</code> and the caller name <code>?</code> if the number is hidden or unknown.</p>
        </main>
    </body>
</html>
