<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Set Tasker Pref</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Set Tasker Pref</h1>
                <p class="description">Dynamically set a preference value normally configured via <i>Menu / Preferences</i> in the Tasker UI.</p>
            </header>

            <p>The changed values will have immediate effect unless the related operation is already in progress.</p>
            <p>The <var>Use Reliable Alarms</var> preference will not cause existing alarms to be recreated.</p>
        </main>
    </body>
</html>
