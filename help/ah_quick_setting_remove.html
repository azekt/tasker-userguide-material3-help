    <body>
        <main>
            <header>
                <h1>Quick Setting Remove</h1>
                <p class="description">Remove a custom tile previously added to the system Quick Settings panel with action <a href="ah_quick_setting_add.html">Quick Setting Add</a>.</p>
            </header>

            <p>It is not classified as an error if the tile did not previously exist.</p>
            <p>Only usable on Cyanogen 5.1.1+ ROMs with Custom Tile support.</p>
        </main>
