<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Shut Up</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Shut Up</h1>
                <p class="description">Stop speech initiated from a previous <a href="ah_say.html">Say</a> or <a href="ah_say_wavenet.html">Say WaveNet</a> action.</p>
            </header>

            <p><b>Note:</b> you must select <span class="param icon icon-boolean">Continue Task Immediately</span> in the <a href="ah_say.html">Say</a> action to be able to use <b>Shut Up</b>, otherwise Tasker will not get to the <b>Shut Up</b> action until the speech has finished anyway.</p>
        </main>
    </body>
</html>
