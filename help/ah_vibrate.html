<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vibrate</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Vibrate</h1>
                <p class="description">Activate the device's vibrator.</p>
            </header>

            <p>The specified <span class="param icon icon-number">Time</span> is in milliseconds i.e. to vibrate for one second enter <var>1000</var>, to vibrate for half a second enter <var>500</var>.</p>
        </main>
    </body>
</html>
