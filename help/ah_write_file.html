<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Write File</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Write File</h1>
                <p class="description">Write the specified text to the specified SD card file.</p>
            </header>

            <p>If <span class="param icon icon-boolean">Append</span> is checked, the text is added to the end of the file without changing the existing contents.</p>
            <p>A newline character is appended to the text if that option is selected.</p>
        </main>
    </body>
</html>
