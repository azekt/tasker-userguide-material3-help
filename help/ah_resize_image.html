<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Resize Image</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Resize Image</h1>
                <p class="description">Resize and scale the image currently in the image store.</p>
            </header>

            <p>Specifying a value of <code>0</code> for one of <span class="param icon icon-text">Width</span> or <span class="param icon icon-text">Height</span> will cause that dimension to be scaled proportionally with the other dimension so as to keep the original aspect ratio of the image.</p>

            <footer>
                <h2>See also:</h2>
                <ul>
                    <li><a href="ah_load_image.html">Load Image</a> action</li>
                </ul>
            </footer>
        </main>
    </body>
</html>
