<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Reboot</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Reboot</h1>
                <p class="description">Reboot (or just shutdown) the device.</p>
            </header>

            <p>Unfortunately, this is not a 'clean' shutdown. Neither Android nor running applications are informed that the device is rebooting, so be prepared for possible data corruption.</p>
            <p>On the other hand, every other app that allows reboot does it the same way.</p>
        </main>
    </body>
</html>
