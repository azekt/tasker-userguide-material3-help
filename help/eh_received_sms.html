<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Received Text</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Received Text</h1>
                <p class="description">A text message has been received.</p>
            </header>

            <p>If the <span class="param icon icon-text">Sender</span> parameter is filled in, only texts from senders that match the <span class="param icon icon-text">Sender</span> parameter will match.</p>
            <p>You can long-click multiple times to match multiple senders.</p>
            <p><span class="param icon icon-text">Content</span> is the Body of an SMS, or the Subject of an MMS.</p>
        </main>
    </body>
</html>
