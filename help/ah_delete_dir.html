<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Delete Directory</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Delete Directory</h1>
                <p class="description">Delete an SD card directory.</p>
            </header>

            <p>The path starts in the root directory of the SD card.</p>
            <p>If it is not empty, it will not be deleted unless you specify <span class="param icon icon-boolean">Recurse</span>.</p>
            <p><strong>Warning</strong>: you can delete the whole SD card contents if you are not careful with this option.</p>
        </main>
    </body>
</html>
