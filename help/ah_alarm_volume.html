<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Alarm Volume</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Alarm Volume</h1>
                <p class="description">Alarm volume level.</p>
            </header>

            <p>Setting to <var>0</var> will mute alarms.</p>
            <p>When <span class="param icon icon-boolean">Display</span> is enabled, a popup will show the new level.</p>
            <p>When <span class="param icon icon-boolean">Sound</span> is enabled, a tone will sound at the new volume level.</p>
        </main>
    </body>
</html>
