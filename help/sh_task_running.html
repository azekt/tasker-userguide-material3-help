<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Task Running</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Task Running</h1>
                <p class="description">A Tasker task with the specified name is running.</p>
            </header>

            <p><span class="param icon icon-text">Name</span> is a simple match, see <a href="../matching.html">Pattern Matching</a> in the Userguide.</p>
            <p><i>Running</i> means that the task is in the queue for it's actions to be executed but it's not necessarily the case that one of its actions is currently being carried out.</p>
        </main>
    </body>
</html>
