<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Set Widget Icon</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Set Widget Icon</h1>
                <p class="description">Change the label of the specified (existing) Task Widget on the home screen.</p>
            </header>

            <p><span class="param icon icon-text">Name</span> is the name of the Task which the widget performs (which appears on the homescreen, unless a label has been set with <a href="ah_change_widget_text.html">Set Widget Label</a>.</p>
            <p><span class="param icon icon-image">Icon</span> is the new icon to set.</p>
        </main>
    </body>
</html>
