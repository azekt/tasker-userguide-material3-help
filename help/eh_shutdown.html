<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Device Shutdown</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <main>
            <header>
                <h1>Device Shutdown</h1>
                <p class="description">The phone is about to shutdown (completely turned off, not standby).</p>
            </header>

            <p><b>Note:</b> this is right before shutdown. You might backup a file or similar, but UI interactions such as dialogs and anything that takes a significant amount of time will not work.</p>
        </main>
    </body>
</html>
